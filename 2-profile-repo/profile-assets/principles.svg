<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="412" viewBox="0 0 1200 412" role="img">
<defs>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#0A1030"/><stop offset="42%" stop-color="#070C24"/><stop offset="100%" stop-color="#050818"/>
</linearGradient>
<linearGradient id="brd" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#4CC9F0" stop-opacity=".85"/><stop offset="45%" stop-color="#C77DFF" stop-opacity=".7"/><stop offset="100%" stop-color="#C77DFF" stop-opacity=".12"/>
</linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#4CC9F0"/><stop offset="55%" stop-color="#8B7BFF"/><stop offset="100%" stop-color="#C77DFF"/>
</linearGradient>
<radialGradient id="bloomA" cx="18%" cy="8%" r="55%">
 <stop offset="0" stop-color="#4CC9F0" stop-opacity=".16"/><stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
</radialGradient>
<radialGradient id="bloomB" cx="88%" cy="95%" r="60%">
 <stop offset="0" stop-color="#C77DFF" stop-opacity=".18"/><stop offset="1" stop-color="#C77DFF" stop-opacity="0"/>
</radialGradient>
