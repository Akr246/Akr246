<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Arya K. Ravi — The Series</title>
  <desc id="desc">Psychology, product and responsible AI. A coral-red A from Arya’s portfolio appears over the rings of a cinema lens.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2=".25" gradientUnits="objectBoundingBox">
      <stop stop-color="#151522"/>
      <stop offset=".50" stop-color="#21141f"/>
      <stop offset="1" stop-color="#410f25"/>
    </linearGradient>
    <radialGradient id="lensLight">
      <stop stop-color="#ac2b43" stop-opacity=".9"/>
      <stop offset=".57" stop-color="#87223f" stop-opacity=".66"/>
      <stop offset="1" stop-color="#711531" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe2b5"/>
      <stop offset=".23" stop-color="#ffad85"/>
      <stop offset=".51" stop-color="#ff6c66"/>
      <stop offset=".76" stop-color="#f93450"/>
      <stop offset="1" stop-color="#e71c48"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2=".65">
      <stop stop-color="#ffe0b4"/>
      <stop offset="1" stop-color="#ed526f"/>
    </linearGradient>
    <pattern id="film" width="38" height="10" patternUnits="userSpaceOnUse">
      <rect width="15" height="5" x="7" y="2.5" rx="1.5" fill="#ec91a2" opacity=".48"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="15"/></clipPath>
    <!-- The stroke geometry is the A monogram used by the portfolio. -->
    <path id="monogram" d="M215 680 390 225 565 680 M275 530h230"/>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <ellipse cx="1000" cy="165" rx="365" ry="288" fill="url(#lensLight)"/>
    <g fill="none" transform="rotate(-19 965 161)">
      <ellipse cx="965" cy="161" rx="265" ry="207" stroke="#e8788c" opacity=".31"/>
      <ellipse cx="965" cy="161" rx="253" ry="198" stroke="#e8788c" opacity=".23"/>
      <ellipse cx="965" cy="161" rx="238" ry="187" stroke="#f4a0aa" stroke-width="3" stroke-dasharray="1 11" opacity=".48"/>
      <ellipse cx="965" cy="161" rx="220" ry="174" stroke="#f5a3ab" opacity=".42"/>
      <ellipse cx="965" cy="161" rx="203" ry="161" stroke="#f5a3ab" opacity=".23"/>
      <ellipse cx="965" cy="161" rx="165" ry="131" stroke="#ffc1b6" opacity=".45"/>
    </g>
    <g fill="none" stroke="#ffb3bd" opacity=".44" transform="rotate(-32 965 161)">
      <ellipse cx="965" cy="161" rx="264" ry="81"/>
      <ellipse cx="965" cy="161" rx="228" ry="57" stroke-dasharray="3 8" opacity=".72"/>
    </g>
    <g transform="translate(765 -50) scale(.47)" fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="9">
      <use href="#monogram" transform="translate(75 35)" stroke="#2a0c21" stroke-width="66"/>
      <use href="#monogram" transform="translate(54 24)" stroke="#7d1e40" stroke-width="64"/>
      <use href="#monogram" transform="translate(28 12)" stroke="#b4274a" stroke-width="64"/>
      <use href="#monogram" stroke="url(#edge)" stroke-width="65"/>
      <use href="#monogram" stroke="url(#face)" stroke-width="61"/>
    </g>
    <g stroke="#ffd6cb" fill="none" stroke-width="2" opacity=".80">
      <path d="M773 59h15m-7.5-7.5v15M1130 251h15m-7.5-7.5v15"/>
    </g>
    <g fill="#ffbfac">
      <circle cx="709" cy="198" r="2.5"/>
      <circle cx="1045" cy="15" r="2.5"/>
      <circle cx="1158" cy="99" r="3"/>
    </g>
    <path d="M0 0v320" stroke="#ff5f65" stroke-width="12"/>
    <g transform="translate(56 45)">
      <rect x="0" y="0" width="39" height="26" rx="4" fill="none" stroke="#ff8583" stroke-width="2"/>
      <path d="M15 6.7 26 13l-11 6.3z" fill="#ff8583"/>
      <text x="54" y="21" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="bold" letter-spacing="4" fill="#ffaaa2">THE SERIES</text>
    </g>
    <text x="53" y="189" font-family="P052, Palatino, Georgia, serif" font-size="111" font-weight="bold" letter-spacing="-5" fill="#fff4e2">Arya K. Ravi</text>
    <text x="60" y="247" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" letter-spacing="-.65" fill="#f5d7d8">Psychology, product &amp; responsible AI</text>
    <rect x="58" y="286" width="47" height="4" rx="2" fill="#ff6b68"/>
    <rect x="109" y="286" width="23" height="4" rx="2" fill="#ed9caa"/>
    <rect x="136" y="286" width="11" height="4" rx="2" fill="#f9d3aa"/>
    <rect x="772" y="303" width="428" height="9" fill="url(#film)"/>
    <rect x=".75" y=".75" width="1198.5" height="318.5" rx="15" fill="none" stroke="#aa647b" opacity=".47"/>
  </g>
</svg>
